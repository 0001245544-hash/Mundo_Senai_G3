
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica 3D</title>

    <!-- Biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #172b3b;
            color: white;
        }

        header, footer {
            padding: 15px;
            text-align: center;
            background: #172b3b;
        }

        header h1 {
            margin: 0;
        }

        .instrucoes {
            padding: 12px;
            text-align: center;
            background: #30495b;
        }

        a-scene {
            height: 75vh;
            width: 100%;
        }
    </style>
</head>

<body>

<header>
    <h1>Oficina Mecânica 3D</h1>
    <p>Simulação virtual com HTML e A-Frame</p>
</header>

<div class="instrucoes">
    Use o mouse para olhar ao redor e W, A, S, D para se movimentar.
    O modo VR depende de equipamento compatível.
</div>

<a-scene embedded
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true; shadows: true">

    <!-- Iluminação -->
    <a-sky color="#9eb7c8"></a-sky>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>

    <a-entity light="type: directional; intensity: 1"
        position="-4 8 5"></a-entity>

    <a-entity light="type: point; intensity: 1.2"
        position="0 4 -2"></a-entity>

    <!-- Piso e paredes -->
    <a-plane position="0 0 0"
        rotation="-90 0 0"
        width="16" height="14"
        color="#777f85"></a-plane>

    <a-box position="0 2.5 -7"
        width="16" height="5" depth="0.2"
        color="#c7cdd1"></a-box>

    <a-box position="-8 2.5 0"
        width="0.2" height="5" depth="14"
        color="#aab3ba"></a-box>

    <a-box position="8 2.5 0"
        width="0.2" height="5" depth="14"
        color="#aab3ba"></a-box>

    <!-- Faixas de segurança -->
    <a-box position="-5 0.02 -1"
        width="0.12" height="0.03" depth="9"
        color="#ffcc00"></a-box>

    <a-box position="5 0.02 -1"
        width="0.12" height="0.03" depth="9"
        color="#ffcc00"></a-box>

    <!-- Placa da oficina -->
    <a-box position="0 4.1 -6.8"
        width="4.5" height="0.6" depth="0.1"
        color="#172b3b"></a-box>

    <a-text value="OFICINA MECANICA"
        position="0 4.1 -6.73"
        align="center"
        color="#ffffff"
        width="6"></a-text>

    <!-- Carroceria do carro -->
    <a-box position="0 0.85 -1.3"
        width="3.5" height="0.65" depth="1.5"
        color="#bd292f"></a-box>

    <!-- Capô -->
    <a-box position="1 1.13 -1.3"
        width="1.15" height="0.12" depth="1.4"
        color="#e34446"></a-box>

    <!-- Cabine e vidros -->
    <a-box position="0 1.35 -1.3"
        width="1.7" height="0.52" depth="1.18"
        color="#9bc8df"></a-box>

    <a-box position="0 1.63 -1.3"
        width="1.65" height="0.08" depth="1.2"
        color="#bd292f"></a-box>

    <!-- Rodas -->
    <a-cylinder position="-1.05 0.47 -2.08"
        radius="0.35" height="0.18"
        rotation="0 0 90" color="#20252a"></a-cylinder>

    <a-cylinder position="1.05 0.47 -2.08"
        radius="0.35" height="0.18"
        rotation="0 0 90" color="#20252a"></a-cylinder>

    <a-cylinder position="-1.05 0.47 -0.52"
        radius="0.35" height="0.18"
        rotation="0 0 90" color="#20252a"></a-cylinder>

    <a-cylinder position="1.05 0.47 -0.52"
        radius="0.35" height="0.18"
        rotation="0 0 90" color="#20252a"></a-cylinder>

    <!-- Faróis -->
    <a-box position="1.77 0.9 -1.75"
        width="0.07" height="0.17" depth="0.28"
        color="#fff0b0"></a-box>

    <a-box position="1.77 0.9 -0.85"
        width="0.07" height="0.17" depth="0.28"
        color="#fff0b0"></a-box>

    <!-- Bancada de ferramentas -->
    <a-box position="-5 1.12 -3.4"
        width="3.3" height="0.16" depth="1.1"
        color="#725238"></a-box>

    <a-box position="-6.35 0.55 -3.4"
        width="0.13" height="1.1" depth="0.13"
        color="#343d44"></a-box>

    <a-box position="-3.65 0.55 -3.4"
        width="0.13" height="1.1" depth="0.13"
        color="#343d44"></a-box>

    <!-- Gaveteiro -->
    <a-box position="-5 0.58 -3.82"
        width="2.7" height="1" depth="0.08"
        color="#3e4b54"></a-box>

    <a-box position="-5.7 0.75 -3.76"
        width="0.7" height="0.2" depth="0.05"
        color="#aeb9c2"></a-box>

    <a-box position="-5.7 0.43 -3.76"
        width="0.7" height="0.2" depth="0.05"
        color="#aeb9c2"></a-box>

    <!-- Ferramentas sobre a bancada -->
    <a-cylinder position="-5.9 1.28 -3.35"
        radius="0.045" height="0.7"
        rotation="0 0 75" color="#dce2e6"></a-cylinder>

    <a-cylinder position="-5.1 1.28 -3.35"
        radius="0.06" height="0.5"
        rotation="0 0 90" color="#d64c3c"></a-cylinder>

    <a-box position="-4.4 1.25 -3.4"
        width="0.55" height="0.1" depth="0.12"
        color="#e5b943"></a-box>

    <!-- Armário de ferramentas -->
    <a-box position="-6.6 1.5 -5.7"
        width="1.2" height="3" depth="0.7"
        color="#c94738"></a-box>

    <a-box position="-6.6 1.5 -5.31"
        width="1.05" height="2.8" depth="0.05"
        color="#aeb9c2"></a-box>

    <!-- Máquina industrial -->
    <a-box position="3.8 1.15 -4.2"
        width="2" height="2.2" depth="1.4"
        color="#3d718a"></a-box>

    <a-box position="3.8 1.55 -3.46"
        width="1.1" height="0.55" depth="0.06"
        color="#202d36"></a-box>

    <a-box position="3.8 1.55 -3.42"
        width="0.8" height="0.3" depth="0.04"
        color="#70d2d0"></a-box>

    <!-- Carrinho de ferramentas -->
    <a-box position="6.1 0.65 -2.2"
        width="1.1" height="0.75" depth="0.7"
        color="#c94738"></a-box>

    <a-box position="6.1 1.1 -2.2"
        width="1.2" height="0.1" depth="0.8"
        color="#333d45"></a-box>

    <!-- Placas de segurança -->
    <a-box position="-3 3.4 -6.82"
        width="1.5" height="0.65" depth="0.06"
        color="#267c52"></a-box>

    <a-text value="SEGURANCA"
        position="-3 3.4 -6.77"
        align="center" color="#ffffff" width="2.5"></a-text>

    <a-box position="3 3.4 -6.82"
        width="1.3" height="0.65" depth="0.06"
        color="#164b82"></a-box>

    <a-text value="USE EPI"
        position="3 3.4 -6.77"
        align="center" color="#ffffff" width="2.5"></a-text>

    <!-- Câmera e cursor -->
    <a-entity position="0 1.65 5">
        <a-camera
            wasd-controls="acceleration: 18"
            look-controls>
            <a-cursor color="#ffffff" fuse="false"></a-cursor>
        </a-camera>
    </a-entity>

</a-scene>

<footer>
    Trabalho escolar • Realidade 3D (WebVR) • HTML + A-Frame
</footer>

</body>
</html>
