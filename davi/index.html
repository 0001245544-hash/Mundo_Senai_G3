<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan GT-R | Experiência 3D</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .painel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #ff3030;
        }

        h1 {
            color: #ff3030;
            margin: 0;
        }

        p {
            font-size: 14px;
        }

        button {
            background: #d71920;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #ff4545;
        }
    </style>
</head>

<body>

    <div class="painel">
        <h1>NISSAN GT-R R35</h1>
        <p>Experiência Imersiva 3D</p>

        <button onclick="mudarCor('#d71920')">Vermelho</button>
        <button onclick="mudarCor('#1769aa')">Azul</button>
        <button onclick="mudarCor('#222222')">Preto</button>

        <br>

        <button onclick="controlarRotacao()">
            Girar / Parar
        </button>
    </div>

    <a-scene background="color: #101018"
             renderer="antialias: true">

        <!-- ILUMINAÇÃO -->

        <a-light type="ambient"
                 color="#ffffff"
                 intensity="0.7">
        </a-light>

        <a-light type="directional"
                 position="-3 8 5"
                 intensity="1.5">
        </a-light>

        <a-light type="point"
                 position="3 5 -2"
                 color="#5588ff"
                 intensity="1.2">
        </a-light>

        <!-- CHÃO -->

        <a-plane position="0 -0.1 0"
                 rotation="-90 0 0"
                 width="40"
                 height="40"
                 color="#252530"
                 material="roughness: 0.5">
        </a-plane>

        <!-- PLATAFORMA -->

        <a-cylinder position="0 0.05 0"
                    radius="3.5"
                    height="0.2"
                    color="#111111">
        </a-cylinder>

        <a-torus position="0 0.17 0"
                 rotation="-90 0 0"
                 radius="3.3"
                 radius-tubular="0.025"
                 color="#ff2020">
        </a-torus>

        <!-- CARRO GT-R -->

        <a-entity id="carro"
                  position="0 0.45 0"
                  rotation="0 25 0"
                  animation="property: rotation;
                             to: 0 385 0;
                             loop: true;
                             dur: 18000;
                             easing: linear">

            <!-- CARROCERIA PRINCIPAL -->

            <a-box class="pintura"
                   position="0 0.65 0"
                   width="2.1"
                   height="0.55"
                   depth="4.5"
                   color="#d71920"
                   material="metalness: 0.7; roughness: 0.25">
            </a-box>

            <!-- CAPÔ -->

            <a-box class="pintura"
                   position="0 0.92 -1.35"
                   width="1.95"
                   height="0.12"
                   depth="1.5"
                   color="#d71920">
            </a-box>

            <!-- TETO -->

            <a-box class="pintura"
                   position="0 1.35 0.15"
                   width="1.65"
                   height="0.48"
                   depth="2"
                   color="#d71920"
                   material="metalness: 0.6">
            </a-box>

            <!-- PARA-BRISA -->

            <a-box position="0 1.38 -0.88"
                   rotation="25 0 0"
                   width="1.58"
                   height="0.65"
                   depth="0.06"
                   color="#101c30"
                   material="metalness: 0.5; opacity: 0.9">
            </a-box>

            <!-- VIDRO TRASEIRO -->

            <a-box position="0 1.38 1.12"
                   rotation="-25 0 0"
                   width="1.55"
                   height="0.6"
                   depth="0.06"
                   color="#101c30">
            </a-box>

            <!-- VIDROS LATERAIS -->

            <a-box position="-0.84 1.38 0.15"
                   width="0.04"
                   height="0.38"
                   depth="1.35"
                   color="#111c30">
            </a-box>

            <a-box position="0.84 1.38 0.15"
                   width="0.04"
                   height="0.38"
                   depth="1.35"
                   color="#111c30">
            </a-box>

            <!-- RODAS -->

            <a-cylinder position="-1.08 0.42 -1.35"
                        rotation="0 0 90"
                        radius="0.48"
                        height="0.24"
                        color="#080808">
            </a-cylinder>

            <a-cylinder position="1.08 0.42 -1.35"
                        rotation="0 0 90"
                        radius="0.48"
                        height="0.24"
                        color="#080808">
            </a-cylinder>

            <a-cylinder position="-1.08 0.42 1.35"
                        rotation="0 0 90"
                        radius="0.48"
                        height="0.24"
                        color="#080808">
            </a-cylinder>

            <a-cylinder position="1.08 0.42 1.35"
                        rotation="0 0 90"
                        radius="0.48"
                        height="0.24"
                        color="#080808">
            </a-cylinder>

            <!-- RODAS: AROS -->

            <a-cylinder position="-1.21 0.42 -1.35"
                        rotation="0 0 90"
                        radius="0.29"
                        height="0.02"
                        color="#888888">
            </a-cylinder>

            <a-cylinder position="1.21 0.42 -1.35"
                        rotation="0 0 90"
                        radius="0.29"
                        height="0.02"
                        color="#888888">
            </a-cylinder>

            <a-cylinder position="-1.21 0.42 1.35"
                        rotation="0 0 90"
                        radius="0.29"
                        height="0.02"
                        color="#888888">
            </a-cylinder>

            <a-cylinder position="1.21 0.42 1.35"
                        rotation="0 0 90"
                        radius="0.29"
                        height="0.02"
                        color="#888888">
            </a-cylinder>

            <!-- FARÓIS DIANTEIROS -->

            <a-box position="-0.75 0.82 -2.27"
                   width="0.48"
                   height="0.16"
                   depth="0.06"
                   color="#ffffff"
                   material="emissive: #ffffff;
                             emissiveIntensity: 1">
            </a-box>

            <a-box position="0.75 0.82 -2.27"
                   width="0.48"
                   height="0.16"
                   depth="0.06"
                   color="#ffffff"
                   material="emissive: #ffffff;
                             emissiveIntensity: 1">
            </a-box>

            <!-- GRADE DIANTEIRA -->

            <a-box position="0 0.55 -2.28"
                   width="1.25"
                   height="0.3"
                   depth="0.06"
                   color="#050505">
            </a-box>

            <!-- LANTERNAS TRASEIRAS REDONDAS -->

            <a-torus position="-0.75 0.85 2.28"
                     radius="0.16"
                     radius-tubular="0.045"
                     color="#ff0000"
                     material="emissive: #ff0000;
                               emissiveIntensity: 1">
            </a-torus>

            <a-torus position="-0.35 0.85 2.28"
                     radius="0.16"
                     radius-tubular="0.045"
                     color="#ff0000"
                     material="emissive: #ff0000;
                               emissiveIntensity: 1">
            </a-torus>

            <a-torus position="0.35 0.85 2.28"
                     radius="0.16"
                     radius-tubular="0.045"
                     color="#ff0000"
                     material="emissive: #ff0000;
                               emissiveIntensity: 1">
            </a-torus>

            <a-torus position="0.75 0.85 2.28"
                     radius="0.16"
                     radius-tubular="0.045"
                     color="#ff0000"
                     material="emissive: #ff0000;
                               emissiveIntensity: 1">
            </a-torus>

            <!-- AEROFÓLIO -->

            <a-box position="-0.7 1.2 2"
                   width="0.08"
                   height="0.5"
                   depth="0.1"
                   color="#111111">
            </a-box>

            <a-box position="0.7 1.2 2"
                   width="0.08"
                   height="0.5"
                   depth="0.1"
                   color="#111111">
            </a-box>

            <a-box position="0 1.48 2"
                   width="2.1"
                   height="0.1"
                   depth="0.45"
                   color="#111111">
            </a-box>

        </a-entity>

        <!-- GARAGEM -->

        <a-box position="0 4 -8"
               width="16"
               height="8"
               depth="0.2"
               color="#202030">
        </a-box>

        <a-box position="-8 4 0"
               width="0.2"
               height="8"
               depth="16"
               color="#181820">
        </a-box>

        <a-box position="8 4 0"
               width="0.2"
               height="8"
               depth="16"
               color="#181820">
        </a-box>

        <!-- ILUMINAÇÃO DECORATIVA -->

        <a-box position="0 5 -7.8"
               width="8"
               height="0.08"
               depth="0.08"
               color="#ff2020"
               material="emissive: #ff2020">
        </a-box>

        <!-- CÂMERA -->

        <a-entity position="0 2.5 8">

            <a-camera look-controls
                      wasd-controls>

                <a-cursor color="#ffffff"
                          fuse="false">
                </a-cursor>

            </a-camera>

        </a-entity>

        <!-- CÉU -->

        <a-sky color="#101018"></a-sky>

    </a-scene>

    <script>

        // Alterar a cor da carroceria

        function mudarCor(cor) {
            const partes = document.querySelectorAll('.pintura');

            partes.forEach(parte => {
                parte.setAttribute('material', 'color', cor);
            });
        }

        // Controlar rotação do carro

        let girando = true;

        function controlarRotacao() {
            const carro = document.querySelector('#carro');

            if (girando) {
                carro.pause();
                girando = false;
            } else {
                carro.play();
                girando = true;
            }
        }

    </script>

</body>
</html>
